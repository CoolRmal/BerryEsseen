name: Final sandboxed comparator

on:
  workflow_dispatch:
    inputs:
      proof-cache-tag:
        description: Optional release tag containing compiled outputs for this exact commit
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the certificate outputs
        run: bash scripts/prepare_linux_ci.sh
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
      - name: Restore checked project outputs
        id: project-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: berry-proofs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: berry-proofs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Restore optional compiled proof cache
        if: inputs.proof-cache-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CACHE_TAG: ${{ inputs.proof-cache-tag }}
        run: |
          [[ "$CACHE_TAG" =~ ^proof-cache-[0-9a-f]{12}$ ]]
          gh release download "$CACHE_TAG" --pattern 'proof-cache.part-*' --pattern proof-cache.json --dir "$RUNNER_TEMP/berry-proof-cache"
          python3 scripts/proof_cache.py restore "$RUNNER_TEMP/berry-proof-cache"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build supporting certificates in bounded batches
        run: python3 scripts/build_certificates.py --batch-size 2
      - name: Save checked project outputs
        if: steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: berry-proofs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Verify source files remain unchanged
        run: git diff --exit-code
      - name: Provide memory headroom for the complete proof replay
        run: |
          sudo fallocate -l 16G "$RUNNER_TEMP/berry-comparator.swap"
          sudo chmod 600 "$RUNNER_TEMP/berry-comparator.swap"
          sudo mkswap "$RUNNER_TEMP/berry-comparator.swap"
          sudo swapon "$RUNNER_TEMP/berry-comparator.swap"
      - name: Enable the unprivileged user service manager
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Compare the theorem with the trusted challenge
        shell: bash
        run: |
          set -o pipefail
          mkdir -p comparator/results
          scripts/run_comparator_linux.sh 2>&1 | tee comparator/results/final-linux.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparator-log
          path: comparator/results/final-linux.log
