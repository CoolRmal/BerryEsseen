name: Supporting Lean library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the build outputs
        run: bash scripts/prepare_linux_ci.sh
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
      - name: Restore checked project outputs
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: berry-proofs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: berry-proofs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build the library, the 0.423 proof and the lower bound
        run: lake build BerryEsseen Solution Challenge
