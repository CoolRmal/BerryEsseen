name: Supporting Lean library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: "false"
      - name: Check certificates and supporting library
        run: python3 scripts/build_certificates.py --batch-size 2
